# 週次の更新と公開（毎週日曜 日本時間15時）。
# 収集 → AI要約 → 検証 → data/ をコミット → そのコミットから画面を作って GitHub Pages に公開する。
# 手動実行（workflow_dispatch）は GitHub の「Actions」タブからだけ。公開された画面には実行ボタンを置かない。
name: 週次更新と公開

on:
  schedule:
    # 日曜 15:00 JST = 日曜 06:00 UTC（cron は UTC で書く）。混雑時は遅れたり、まれに抜けたりする
    - cron: "0 6 * * 0"
  workflow_dispatch:

# 同時に2つ動かさない（途中で止めない）
concurrency:
  group: weekly-update
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    name: 収集・要約・コミット
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write   # data/ のコミットを main へ push するため
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: 依存を入れる
        run: pip install -r requirements.txt

      - name: 設定とデータを検証する
        run: python -m collector.validate

      # AIのAPIキーが使えるかを、課金されない方法で先に確認する。使えなくても収集と公開は続け、最後の手順で赤にして知らせる
      - name: AIのAPIキーを確認する（無料）
        id: keycheck
        continue-on-error: true
        env:
          INFO_AI_API_KEY: ${{ secrets.INFO_AI_API_KEY }}
        run: python scripts/check_ai_key.py

      # 取得に失敗した（情報源が全滅した）場合はここで止まり、何も保存・公開しない。
      # 一部の情報源だけ失敗した場合は成功分を保存し、失敗した情報源の成功地点は進めない（収集CLIの仕様）
      - name: 収集する（採用した情報源だけ）
        run: python -m collector.collect --allow-network

      # AIのAPIキーは Secrets からこの手順の環境変数にだけ渡す。ログには出さない。
      # 要約に失敗しても、収集できた記事は「未要約」として公開する。失敗は最後の手順で赤にして知らせる
      - name: AIで要約する
        id: summarize
        continue-on-error: true
        env:
          INFO_AI_API_KEY: ${{ secrets.INFO_AI_API_KEY }}
        run: python -m collector.summarize

      - name: 画面用データと週次レポートを作る
        run: |
          python -m collector.validate
          python -m collector.export --mode real
          python -m collector.report --mode real

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 画面のテストと1ファイル版の作成
        working-directory: web
        run: |
          npm ci
          npm test
          npm run build:standalone

      # 1ファイル版を作り直した後でないと、画面用データとの一致を調べるテストが失敗する
      - name: テストを実行する
        run: python -m pytest -q

      - name: 秘密値・原文の混入を検査する
        run: python scripts/check_repo_safety.py

      - name: 変更をコミットする
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data web/public/data reports viewer
          if git diff --cached --quiet; then
            echo "変更はありません。"
          else
            git commit -m "週次更新 $(TZ=Asia/Tokyo date +%Y-%m-%d)"
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: AIの失敗を知らせる
        if: steps.summarize.outcome == 'failure' || steps.keycheck.outcome == 'failure'
        run: |
          echo "::error::AIのAPIキーの確認、またはAI要約の手順が失敗しました（収集できた記事は「未要約」として公開されます）。Actionsのログを確認してください。"
          exit 1

  deploy:
    name: 画面を作って公開
    needs: update
    # 要約だけが失敗した場合も、コミット済みのデータを公開する
    if: ${{ !cancelled() && needs.update.outputs.sha != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write      # Pages へ配信するため
      id-token: write   # Pages 配信の本人確認（OIDC）
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # 公開するのは、上でコミットした時点の内容
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.update.outputs.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: ビルドする（サブパスはリポジトリ名）
        working-directory: web
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: |
          npm ci
          npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

      - id: deployment
        uses: actions/deploy-pages@v5
