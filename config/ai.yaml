# AI要約・タグ付けの設定（段階3-a）。APIキーはここに書かない（環境変数 INFO_AI_API_KEY から読む）。
provider: anthropic
# 既定のモデル（段階3-bの比較で Sonnet 5.5 に決定。docs/DECISIONS.md）。実行時に --model で変えられる。
model: claude-sonnet-5-5
# モデルごとの価格（米ドル／100万トークン）。2026-10-02 に公式資料で確認（docs/DECISIONS.md）。概算費用の計算に使う
prices:
  claude-opus-5-5: {input: 4.0, output: 20.0}
  claude-sonnet-5-5: {input: 2.0, output: 10.0}
  claude-haiku-4-5: {input: 1.0, output: 5.0}
# 考える量（low / medium / high）。高いほど丁寧だが出力トークン（費用）が増える。Haiku 4.5 は非対応のため送らない
effort: medium
# 安全上の理由で応答が拒否されたとき、APIが自動で別モデルに切り替える（Anthropic の server-side fallback）。
# 対応するモデル（Opus 5.5・Sonnet 5.5 など）でだけ使い、Haiku 4.5 では送らない
fallbacks: true
limits:
  max_articles_per_run: 60        # 1回の実行で処理する記事数の上限
  max_input_chars: 20000          # 1記事の本文の上限（超えた分は使わず、その旨を記録）
  max_input_tokens_per_run: 1000000  # 1回の実行の入力トークン合計の上限（超えた記事は上限超過として未処理）
  max_output_tokens: 8000         # 1回の応答の上限
  max_retries: 2                  # APIエラー・出力の形の誤りのときの再試行回数
