# 画面の設定
site_name: 外部環境情報（検証版）
# 修正依頼フォーム（Microsoft Forms等）のURL。未定のため null（画面では「未設定」と表示）
correction_request_url: null
# demo = 架空データのみ表示（全画面に「架空データ」と表示）、real = 実データ
release_mode: real
page_size: 50
# 最新一覧に出す期間（日数）。公開日で数え（日付不明・月のみの記事は取得日）、最終収集日を含めて何日分か
latest_days: 7
# 最終収集（または情報源の最終成功）からこの日数を超えたら、取得状況画面で「データが古い」と警告する
stale_after_days: 8
