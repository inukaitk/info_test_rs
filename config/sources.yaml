# 情報源の設定。現在はすべて架空（段階2-bで採用した実在の情報源に置き換える）。
# URLは予約済みの例示用ドメイン（example.org等）を使い、実在の機関名・URLは使わない。
sources:
  - id: demo-kodomo-rss
    name: 架空こども政策庁（デモ）
    entry_url: https://kodomo.example.org/news/rss.xml
    method: rss
    allowed_hosts:
      - kodomo.example.org
    link_rules:
      include:
        - "^https://kodomo\\.example\\.org/news/"
    timezone: Asia/Tokyo
    limits:
      max_items: 30
      max_bytes: 5242880
      wait_seconds: 3
      timeout_seconds: 30
    enabled: true
    notes: 架空の情報源。RSSから新着を取得する例。

  - id: demo-boshi-html
    name: 架空母子保健研究機構（デモ）
    entry_url: https://boshi.example.net/info/index.html
    method: html
    allowed_hosts:
      - boshi.example.net
      - files.boshi.example.net
    link_rules:
      css_selector: "main .news-list"
      include:
        - "^https://boshi\\.example\\.net/info/\\d{8}\\.html$"
        - "^https://files\\.boshi\\.example\\.net/.+\\.pdf$"
      exclude:
        - "/info/archive/"
    pagination:
      next_selector: "a.next"
      max_pages: 3
    timezone: Asia/Tokyo
    limits:
      max_items: 20
      max_bytes: 10485760
      wait_seconds: 5
      timeout_seconds: 30
    enabled: true
    notes: 架空の情報源。HTML一覧ページと掲載PDFを取得する例。

  - id: demo-manual
    name: 架空自治体標準化推進室（デモ）
    entry_url: https://hyojunka.example.com/
    method: manual
    allowed_hosts:
      - hyojunka.example.com
    timezone: Asia/Tokyo
    limits:
      max_items: 10
      max_bytes: 1048576
      wait_seconds: 5
      timeout_seconds: 30
    enabled: false
    notes: 架空の情報源。自動取得できない場合にタイトルとURLを手動登録する例。
