      # 「限定」（会員向け）のページ。ログイン・認証回避は行わないため、本文は取得せず、題名・日付・リンクだけを記録する
      login_required:
        - "^https://kokasen\\.cfa\\.go\\.jp/login/"
    attachments: {pdf: true, max_files: 3, max_bytes: 12582912, max_pages: 30, exclude_titles: ["座席", "席次"]}
    timezone: Asia/Tokyo
    limits: {max_items: 30, max_bytes: 5242880, wait_seconds: 5, timeout_seconds: 30}
    enabled: true
    notes: >-
      トップページの「新着情報」に直近約16件（ページ送りなし）。新着の多くは「限定」（会員向けでログインが必要）で、
      その本文は取得できないため、題名・日付・出典リンクだけを記録し「読み取れない」と表示する。
      「全般」の新着は一般公開のページで、本文を取得する。#以降だけが違うリンクは同じページとして1件にまとまる。
      robots.txt：管理画面（/site/wp-admin/）以外は許可。利用条件：こども家庭庁のサイトのため公共データ利用規約（PDL1.0）の想定（サイト個別の記載は未確認）。

