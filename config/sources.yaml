  # ④ 採用（2026-10-05）：こども家庭庁のサービスサイト
  - id: kokasen-news
    name: こども家庭センターポータルサイト（新着情報）
    entry_url: https://kokasen.cfa.go.jp/
    method: html
    allowed_hosts: [kokasen.cfa.go.jp]
    link_rules:
      css_selector: "main"
      item_selector: "article.post-block-list-inner"   # トップページの「新着情報」1件分
      title_selector: "h3"
      date_selector: "time.entry-date"
      include:
