te":null,"pages":1},{"title":"座席図（PDF／307KB）","url":"https://www.cfa.go.jp/assets/contents/node/basic_page/field_ref_resources/0899e4c0-6742-42e4-89bf-c67dbf3560d7/776ede33/20260920_councils_kyuyusei-zemmeikaiketsu_0899e4c0_01.pdf","status":"skipped","note":"設定（exclude_titles）で除外した資料です","pages":null},{"title":"要請書　－ 優生保護法問題の全面解決をめざして －（PDF／240KB）","url":"https://www.cfa.go.jp/assets/contents/node/basic_page/field_ref_resources/0899e4c0-6742-42e4-89bf-c67dbf3560d7/1ff7f648/20260920_councils_kyuyusei-zemmeikaiketsu_0899e4c0_02.pdf","status":"ok","note":null,"pages":6},{"title":"旧優生保護法補償金等の相談・請求・認定の状況等（PDF／772KB）","url":"https://www.cfa.go.jp/assets/contents/node/basic_page/field_ref_resources/0899e4c0-6742-42e4-89bf-c67dbf3560d7/ee85a172/20260920_councils_kyuyusei-zemmeikaiketsu_0899e4c0_03.pdf","status":"ok","note":null,"pages":4},{"title":"もう一つの優生政策　優生手術と双璧の隔離収容、今も続く長期入院問題として（PDF／367KB）","url":"https://www.cfa.go.jp/assets/contents/node/basic_page/field_ref_resources/0899e4c0-6742-42e4-89bf-c67dbf3560d7/4aeb2a88/20260920_councils_kyuyusei-zemmeikaiketsu_0899e4c0_04.pdf","status":"skipped","note":"1記事あたりの上限（3件）を超えたため取得していません","pages":null},{"title":"参考資料　基本合意書（PDF／368KB）","url":"https://www.cfa.go.jp/assets/contents/node/basic_page/field_ref_resources/0899e4c0-6742-42e4-89bf-c67dbf3560d7/655cd288/20260920_councils_kyuyusei-zemmeikaiketsu_0899e4c0_05.pdf","status":"skipped","note":"1記事あたりの上限（3件）を超えたため取得していません","pages":null}],"summary":{"status":"success","error":null,"version":3,"outdated":false,"text":"こども家庭庁で令和8年9月30日に開かれた旧優生保護法問題の全面解決に向けた協議(第3回)の議事次第と資料。原告団・弁護団・優生連が関係大臣宛ての要請書を提出し、補償認定の迅速化、周知、調査、恒久対策等を求めた。補償金等の相談・請求・認定状況も示された。","key_points":["要請書は、責任の明確化と謝罪、補償法に基づく全被害者への補償実現、恒久対策の実施を求めている。","認定審査会(月1回)の増設・回数増、被害者本人の審査優先、リーフレット送付、相談窓口整備、都道府県の個別通知、国立病院等の調査などを要請している。","第2作業部会関連で、次期学習指導要領への優生保護法問題の明記、包括的性教育、インクルーシブ教育に関する記載の見直しを求めている。","第3作業部会関連で、国内人権機関の設置、精神科の長期入院問題、障害のある人への子育て等支援、行動計画改定、意識調査、資料保存・資料館設立を求めている。","令和8年8月末の認定累計は2,028件、未決定222件。9月から認定審査会の開催時間を3時間から4時間に延長し、年度
